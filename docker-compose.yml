services:
  db:
    image: postgres:16-alpine
    container_name: sovereign-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supavault}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supavault}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - sovereign

  supabase-auth:
    image: supabase/gotrue:v2.177.0
    container_name: sovereign-brain-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_AUTH_EXTERNAL_URL:-http://INTERNAL_HOST/auth/v1}
      GOTRUE_SITE_URL: ${APP_URL:-http://INTERNAL_HOST}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL:-http://INTERNAL_HOST},${APP_URL:-http://INTERNAL_HOST}/*,http://CLIENT_IP,http://CLIENT_IP/*
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set SUPABASE_JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/supabase_auth?search_path=auth
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/supabase_auth?search_path=auth
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_USER: fake_mail_user
      GOTRUE_SMTP_PASS: fake_mail_password
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${GOTRUE_EXTERNAL_EMAIL_ENABLED:-true}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_OPERATOR_TOKEN: ${SUPABASE_JWT_SECRET:?set SUPABASE_JWT_SECRET}
    networks:
      - sovereign

  supabase-proxy:
    image: nginx:1.27-alpine
    container_name: sovereign-brain-supabase-proxy
    restart: unless-stopped
    depends_on:
      - supabase-auth
    volumes:
      - ./infra/supabase/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sovereign

  api:
    build:
      context: ./overlays/api
      args:
        API_BASE_IMAGE: ${API_BASE_IMAGE:-ghcr.io/leostehlik/llm-wiki-api:latest}
    image: ${API_IMAGE:-sovereign-brain-api:local}
    container_name: sovereign-brain-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      supabase-proxy:
        condition: service_started
    env_file:
      - ./.env
    environment:
      MODE: hosted
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supavault}
      API_URL: http://api:8000
      APP_URL: ${APP_URL:-http://INTERNAL_HOST}
      APP_URLS: ${APP_URLS:-http://INTERNAL_HOST,http://CLIENT_IP}
      SUPABASE_URL: ${SUPABASE_URL:-http://INTERNAL_HOST}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-YOUR_SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set SUPABASE_JWT_SECRET}
      GLOBAL_OCR_ENABLED: "false"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      S3_BUCKET: ""
    expose:
      - "8000"
    networks:
      - sovereign

  web:
    image: ${WEB_IMAGE:-ghcr.io/leostehlik/llm-wiki-web:latest}
    container_name: sovereign-brain-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ./.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://INTERNAL_HOST/api}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://INTERNAL_HOST}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-YOUR_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-http://INTERNAL_HOST/mcp}
      NEXT_PUBLIC_CANONICAL_HOST: ${NEXT_PUBLIC_CANONICAL_HOST:-}
      NEXT_PUBLIC_CANONICAL_REDIRECT_HOSTS: ${NEXT_PUBLIC_CANONICAL_REDIRECT_HOSTS:-}
    expose:
      - "3000"
    networks:
      - sovereign

  mcp:
    build:
      context: ./overlays/mcp
      args:
        MCP_BASE_IMAGE: ${MCP_BASE_IMAGE:-ghcr.io/leostehlik/llm-wiki-mcp:latest}
    image: ${MCP_IMAGE:-sovereign-brain-mcp:local}
    container_name: sovereign-brain-mcp
    restart: unless-stopped
    depends_on:
      - db
      - api
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supavault}
      API_URL: http://api:8000
      APP_URL: ${APP_URL:-http://INTERNAL_HOST}
      MCP_URL: ${MCP_URL:-http://INTERNAL_HOST/mcp}
      SUPABASE_URL: ${SUPABASE_URL:-http://INTERNAL_HOST}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set SUPABASE_JWT_SECRET}
      LOCAL_USER_ID: ${LOCAL_USER_ID:-}
      STATIC_BEARER_TOKEN: ${STATIC_BEARER_TOKEN:-}
    expose:
      - "8080"
    command: ["python", "-m", "server"]
    networks:
      - sovereign

  edge:
    image: nginx:1.27-alpine
    container_name: sovereign-brain-edge
    restart: unless-stopped
    depends_on:
      - web
      - api
      - mcp
      - supabase-proxy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/conf.d/llm-wiki.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/sovereign:ro
    networks:
      - sovereign

volumes:
  pgdata:

networks:
  sovereign:
    driver: bridge
