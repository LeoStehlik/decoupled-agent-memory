map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

upstream llmwiki_web {
  server web:3000;
}

upstream llmwiki_api {
  server api:8000;
}

upstream llmwiki_mcp {
  server mcp:8080;
}

upstream llmwiki_auth {
  server supabase-proxy:80;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 100m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /brain {
    return 308 http://INTERNAL_HOST:3030/brain;
  }

  location = /brain/ {
    return 308 http://INTERNAL_HOST:3030/brain;
  }

  location = /brain-health {
    return 308 http://INTERNAL_HOST:3030/brain-health;
  }

  location = /brain-review {
    return 308 http://INTERNAL_HOST:3030/brain-review;
  }

  location = /brain-brief {
    return 308 http://INTERNAL_HOST:3030/brain-brief;
  }

  location / {
    proxy_pass http://llmwiki_web;
  }

  location /api/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, apikey, Prefer, X-Client-Info, X-Supabase-Api-Version" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, apikey, Prefer, X-Client-Info, X-Supabase-Api-Version" always;

    proxy_pass http://llmwiki_api/;
    proxy_read_timeout 300;
  }

  location /mcp {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, X-Client-Info" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, X-Client-Info" always;

    proxy_pass http://llmwiki_mcp;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location /auth/v1/ {
    proxy_pass http://llmwiki_auth/auth/v1/;
  }
}
